<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Concord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #04407a;
    --mid: #1e88d9;
    --sky: #6fd6f5;
    --teal: #1fd1b0;
    --ice: #f2fbff;
    --ink: #062b46;
    --glass-border: rgba(255,255,255,0.35);
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ice);
    background:
      radial-gradient(ellipse 70% 40% at 20% 0%, rgba(255,255,255,0.55), transparent 55%),
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,255,255,0.3), transparent 55%),
      radial-gradient(ellipse 90% 50% at 88% 96%, rgba(31,209,176,0.45), transparent 60%),
      radial-gradient(ellipse 70% 40% at 8% 82%, rgba(111,214,245,0.35), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 90px),
      linear-gradient(180deg, #1382db 0%, #0b6bc2 28%, var(--deep) 60%, #021f3d 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  h1, h2, h3 { font-family: 'Baloo 2', sans-serif; margin: 0; }

  /* ---------- Bolhas flutuantes de fundo ---------- */
  .bubble-field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.85), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.02) 70%);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: inset -4px -6px 10px rgba(2,40,70,0.25), inset 3px 4px 6px rgba(255,255,255,0.5);
    animation: drift 16s ease-in-out infinite;
  }
  .bubble.b1 { width: 90px; height: 90px; left: 6%; top: 12%; animation-duration: 19s; }
  .bubble.b2 { width: 46px; height: 46px; left: 78%; top: 22%; animation-duration: 14s; animation-delay: -3s; }
  .bubble.b3 { width: 130px; height: 130px; left: 62%; top: 68%; animation-duration: 23s; animation-delay: -8s; opacity: 0.6; }
  .bubble.b4 { width: 34px; height: 34px; left: 14%; top: 58%; animation-duration: 12s; animation-delay: -5s; }
  .bubble.b5 { width: 60px; height: 60px; left: 88%; top: 78%; animation-duration: 17s; animation-delay: -10s; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-22px) translateX(10px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; }
  }

  /* ---------- Globo decorativo ao fundo (referência ao globo da imagem) ---------- */
  #globeGlow {
    position: fixed;
    top: -90px; left: -110px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), transparent 40%),
      conic-gradient(from 200deg, #1fd1b0 0deg 60deg, #1e88d9 60deg 140deg, #6fd6f5 140deg 210deg, #1fd1b0 210deg 280deg, #1e88d9 280deg 360deg);
    filter: blur(2px);
    opacity: 0.22;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- Sparkles (brilhos tipo cristal) ---------- */
  .sparkle {
    position: absolute;
    width: 14px; height: 14px;
    z-index: 2;
    opacity: 0.85;
    animation: twinkle 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  .sparkle.s2 { animation-delay: -1.1s; width: 9px; height: 9px; }
  .sparkle.s3 { animation-delay: -1.8s; width: 11px; height: 11px; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.1) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sparkle { animation: none; opacity: 0.7; }
  }

  /* ---------- Bonequinhos "buddy" (referência aos ícones verde/azul da imagem) ---------- */
  .buddies { display: flex; gap: 14px; align-items: flex-end; justify-content: center; margin-top: 4px; }
  .buddy { position: relative; width: 34px; height: 42px; }
  .buddy .head {
    width: 20px; height: 20px; border-radius: 50%;
    position: absolute; top: 0; left: 7px;
  }
  .buddy .body {
    width: 34px; height: 26px;
    border-radius: 17px 17px 4px 4px;
    position: absolute; bottom: 0; left: 0;
  }
  .buddy.blue .head, .buddy.blue .body {
    background: radial-gradient(circle at 32% 28%, #eaf9ff, var(--sky) 45%, var(--mid) 100%);
    box-shadow: inset 2px 3px 5px rgba(255,255,255,0.75), inset -3px -4px 6px rgba(2,40,80,0.35), 0 4px 10px rgba(2,30,55,0.35);
  }
  .buddy.green .head, .buddy.green .body {
    background: radial-gradient(circle at 32% 28%, #eafff8, var(--teal) 50%, #0c9c82 100%);
    box-shadow: inset 2px 3px 5px rgba(255,255,255,0.75), inset -3px -4px 6px rgba(4,70,60,0.35), 0 4px 10px rgba(2,30,55,0.35);
  }
  .buddiesLabel { font-size: 12px; color: rgba(242,251,255,0.7); text-align: center; margin-top: 2px; }

  #app { width: 100%; max-width: 480px; min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }

  /* ---------- Glass building block ---------- */
  .glass {
    position: relative;
    background: linear-gradient(165deg, rgba(255,255,255,0.32) 0%, rgba(130,224,255,0.14) 45%, rgba(255,255,255,0.05) 100%);
    border: 1px solid var(--glass-border);
    border-bottom: 1px solid rgba(2,30,55,0.4);
    border-radius: var(--radius-md);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: 0 10px 28px rgba(2,20,40,0.4), inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -8px 14px rgba(2,30,55,0.18);
    overflow: hidden;
  }
  .glass::before {
    /* clássico brilho/reflexo Aero no topo */
    content: '';
    position: absolute;
    top: 0; left: 6%; right: 6%;
    height: 46%;
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0));
    border-radius: 50% 50% 60% 60% / 100% 100% 40% 40%;
    pointer-events: none;
  }
  .glass::after {
    /* pingo de brilho no canto, tipo gota d'água */
    content: '';
    position: absolute;
    top: 10%; right: 8%;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    filter: blur(0.5px);
    pointer-events: none;
  }

  /* ---------- Tela de entrada ---------- */
  #joinScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 22px;
    text-align: center;
    position: relative;
  }
  #orbWrap { position: relative; width: 116px; height: 116px; }
  #orb {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 26%, #ffffff 0%, #d8f6ff 16%, var(--sky) 38%, var(--mid) 72%, #073a70 100%);
    box-shadow: 0 14px 34px rgba(4,64,122,0.6), inset -8px -12px 18px rgba(2,30,60,0.4), inset 5px 8px 14px rgba(255,255,255,0.7);
    position: absolute; left: 8px; top: 8px;
  }
  #orb::before {
    content: '';
    position: absolute;
    top: 12%; left: 18%;
    width: 40%; height: 26%;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    filter: blur(1.5px);
    transform: rotate(-18deg);
  }
  #orb::after {
    content: '';
    position: absolute;
    bottom: 16%; right: 20%;
    width: 12px; height: 12px;
    background: rgba(255,255,255,0.75);
    border-radius: 50%;
    filter: blur(0.5px);
  }
  .droplet {
    position: absolute;
    border-radius: 50% 50% 50% 4%;
    background: radial-gradient(circle at 32% 28%, #ffffff, var(--teal) 55%, #0c9c82 100%);
    box-shadow: 0 6px 14px rgba(4,64,122,0.5), inset 2px 3px 5px rgba(255,255,255,0.7);
    transform: rotate(45deg);
  }
  .droplet.d1 { width: 26px; height: 26px; top: -4px; right: -2px; }
  .droplet.d2 { width: 16px; height: 16px; bottom: 4px; left: -6px; background: radial-gradient(circle at 32% 28%, #ffffff, var(--sky) 55%, #1c6fb0 100%); }

  #brand h1 { font-size: 32px; color: var(--ice); letter-spacing: 0.5px; text-shadow: 0 2px 14px rgba(0,0,0,0.3), 0 0 24px rgba(111,214,245,0.5); }
  #brand p { margin: 6px 0 0; font-size: 14px; color: rgba(242,251,255,0.8); }

  .field {
    position: relative;
    width: 100%;
    padding: 14px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    border: none;
    border-top: 1px solid #fff;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff 0%, #eaf7ff 55%, #d5edfb 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -6px 10px rgba(150,205,235,0.5), 0 5px 16px rgba(2,20,40,0.35);
  }
  .field::placeholder { color: #6d8ba3; }

  .btn-primary {
    width: 100%;
    padding: 16px 18px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.3px;
    color: #04314f;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.9);
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(180deg, #d4fbf1 0%, #baf3e6 22%, var(--teal) 58%, #0c9c82 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.85), inset 0 -10px 16px rgba(6,110,90,0.35), 0 8px 20px rgba(15,174,145,0.5);
  }
  .btn-primary:active { transform: translateY(1px); }

  #formStack { width: 100%; display: flex; flex-direction: column; gap: 12px; max-width: 320px; }

  /* ---------- Tela de chamada ---------- */
  #callScreen { display: none; flex: 1; flex-direction: column; min-height: 100vh; position: relative; }

  #topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    margin: 10px 12px 0;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(130,224,255,0.18) 40%, rgba(255,255,255,0.04) 100%) !important;
  }
  #topBar::before { height: 55%; }
  #topBar .roomInfo { display: flex; flex-direction: column; }
  #roomLabel { font-family: 'Baloo 2', sans-serif; font-size: 16px; }
  #peopleCount { font-size: 12px; color: rgba(242,251,255,0.7); }
  #concordMark { font-family: 'Baloo 2', sans-serif; font-size: 14px; color: var(--teal); display: flex; align-items: center; gap: 6px; }
  #concordMark::before {
    content: '';
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #fff, var(--sky) 45%, var(--mid) 100%);
    box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8), 0 2px 4px rgba(2,30,55,0.4);
  }

  #videoGrid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    padding: 12px;
    overflow-y: auto;
    align-content: start;
  }
  .videoBox {
    aspect-ratio: 3/4;
    border-radius: var(--radius-sm);
    background: #012039;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 6px 16px rgba(2,20,40,0.4);
  }
  .videoBox video { width: 100%; height: 100%; object-fit: cover; }
  .videoBox .label {
    position: absolute; bottom: 6px; left: 8px;
    font-size: 11px; padding: 3px 9px;
    border-radius: 999px;
    background: rgba(4,64,122,0.55);
    backdrop-filter: blur(4px);
  }

  /* ---------- Barra de controles flutuante (estilo pílula Aero) ---------- */
  #controlBar {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    margin: 0 auto 14px;
    padding: 10px 16px;
    width: fit-content;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(130,224,255,0.16) 45%, rgba(2,40,70,0.15) 100%) !important;
  }
  #controlBar button {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.9);
    font-size: 19px;
    cursor: pointer;
    background: radial-gradient(circle at 34% 26%, #ffffff 0%, rgba(255,255,255,0.55) 30%, rgba(255,255,255,0.12) 70%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.95), inset 0 -8px 10px rgba(150,190,220,0.4), 0 5px 12px rgba(2,20,40,0.4);
    color: var(--ink);
  }
  #controlBar button.off { background: radial-gradient(circle at 34% 26%, #ffe0e5, #ff8f9c 45%, #e0435c 100%); color: #fff; }
  #leaveBtn { background: radial-gradient(circle at 34% 26%, #ffe0e5, #ff8f9c 45%, #e0435c 100%) !important; color: #fff; }
  #musicToggleBtn { background: radial-gradient(circle at 34% 26%, #e4fff8, var(--teal) 55%, #0c9c82 100%) !important; }

  /* ---------- Painel de música (gaveta) ---------- */
  #musicPanel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    width: 100%; max-width: 480px;
    padding: 18px 18px 24px;
    border-radius: 30px 30px 0 0;
    border-bottom: none;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 20;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 -12px 34px rgba(2,20,40,0.5), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  #musicPanel.open { transform: translateY(0); }
  #musicPanel .handle {
    width: 40px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.5);
    margin: 0 auto 6px;
  }
  #musicPanel h3 { font-size: 16px; color: var(--ice); }
  #musicPanel .controls { display: flex; gap: 8px; }
  #musicPanel .controls button { flex: 1; }
  #musicPanel button:not(.field) {
    padding: 12px; border: none; border-top: 1px solid rgba(255,255,255,0.9); border-radius: 14px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
    cursor: pointer;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0.2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 10px rgba(2,20,40,0.25);
    color: var(--ink);
  }
  #loadMusicBtn {
    background: linear-gradient(180deg, #d4fbf1, var(--teal) 60%, #0c9c82) !important;
    color: #04314f;
  }
  #nowPlaying { font-size: 12px; color: rgba(242,251,255,0.75); text-align: center; }
  #ytPlayerWrap { display: none; }

  /* ---------- Onda decorativa acima dos controles ---------- */
  #wave { display: block; width: 100%; height: 34px; margin-top: -6px; opacity: 0.9; }
</style>
</head>
<body>
<div id="globeGlow"></div>
<div class="bubble-field">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
</div>
<div id="app">

  <div id="joinScreen">

    <svg class="sparkle s1" style="top:18%; left:14%;" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/></svg>
    <svg class="sparkle s2" style="top:30%; right:12%;" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#d8f6ff"/></svg>
    <svg class="sparkle s3" style="bottom:22%; left:10%;" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#baf3e6"/></svg>

    <svg width="70" height="58" viewBox="0 0 70 58" style="position:absolute; top:8%; right:8%; opacity:0.9; filter:drop-shadow(0 4px 8px rgba(2,30,55,0.4));">
      <ellipse cx="20" cy="20" rx="18" ry="13" fill="url(#wingGrad1)" transform="rotate(-18 20 20)"/>
      <ellipse cx="50" cy="20" rx="18" ry="13" fill="url(#wingGrad2)" transform="rotate(18 50 20)"/>
      <ellipse cx="24" cy="40" rx="12" ry="9" fill="url(#wingGrad1)" opacity="0.85" transform="rotate(-10 24 40)"/>
      <ellipse cx="46" cy="40" rx="12" ry="9" fill="url(#wingGrad2)" opacity="0.85" transform="rotate(10 46 40)"/>
      <rect x="33" y="10" width="4" height="38" rx="2" fill="#0c3f66"/>
      <defs>
        <radialGradient id="wingGrad1" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#6fd6f5"/><stop offset="100%" stop-color="#1e88d9"/></radialGradient>
        <radialGradient id="wingGrad2" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#baf3e6"/><stop offset="100%" stop-color="#1fd1b0"/></radialGradient>
      </defs>
    </svg>

    <div id="orbWrap">
      <div id="orb"></div>
      <div class="droplet d1"></div>
      <div class="droplet d2"></div>
    </div>

    <svg width="26" height="24" viewBox="0 0 26 24" style="margin-top:-6px; filter:drop-shadow(0 3px 6px rgba(2,30,55,0.4));">
      <path d="M13 24 C13 24 1 15.5 1 7.8 C1 3 5 0.5 8.5 0.5 C10.8 0.5 12.4 1.8 13 3.3 C13.6 1.8 15.2 0.5 17.5 0.5 C21 0.5 25 3 25 7.8 C25 15.5 13 24 13 24 Z" fill="url(#heartGrad)"/>
      <defs><radialGradient id="heartGrad" cx="35%" cy="25%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#a8f0e0"/><stop offset="100%" stop-color="#1fd1b0"/></radialGradient></defs>
    </svg>

    <div id="brand">
      <h1>Concord</h1>
      <p>Chamada e música, juntos na mesma sala</p>
    </div>
    <div id="formStack">
      <input id="nameInput" class="field" placeholder="Seu nome" maxlength="30">
      <input id="roomInput" class="field" placeholder="Código da sala" maxlength="30">
      <button id="joinBtn" class="btn-primary">Entrar na sala</button>
    </div>

    <div class="buddies">
      <div class="buddy blue"><div class="head"></div><div class="body"></div></div>
      <div class="buddy green"><div class="head"></div><div class="body"></div></div>
    </div>
    <div class="buddiesLabel">chame a galera pra sala</div>
  </div>

  <div id="callScreen">
    <svg class="sparkle s2" style="top:2%; left:6%;" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#d8f6ff"/></svg>
    <div id="topBar" class="glass">
      <div class="roomInfo">
        <span id="roomLabel"></span>
        <span id="peopleCount"></span>
      </div>
      <span id="concordMark">Concord</span>
    </div>

    <div id="videoGrid"></div>

    <svg id="wave" viewBox="0 0 480 34" preserveAspectRatio="none">
      <path d="M0,18 C60,34 120,2 180,14 C240,26 300,4 360,12 C410,18 440,10 480,16 L480,34 L0,34 Z"
            fill="rgba(255,255,255,0.16)"/>
      <path d="M0,24 C70,8 130,30 200,18 C260,8 330,28 400,16 C430,10 460,20 480,18 L480,34 L0,34 Z"
            fill="rgba(31,209,176,0.25)"/>
    </svg>

    <div id="controlBar" class="glass">
      <button id="micBtn" title="Mutar/desmutar">🎤</button>
      <button id="camBtn" title="Ligar/desligar câmera">📷</button>
      <button id="musicToggleBtn" title="Música">🎵</button>
      <button id="leaveBtn" title="Sair">📞</button>
    </div>
  </div>

  <div id="musicPanel" class="glass">
    <div class="handle"></div>
    <h3>Música da sala</h3>
    <input id="ytInput" class="field" placeholder="Cole o link do YouTube">
    <button id="loadMusicBtn">Tocar pra todo mundo</button>
    <div class="controls">
      <button id="playBtn">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
    <div id="nowPlaying">Nenhuma música tocando</div>
    <div id="ytPlayerWrap"><div id="ytPlayer"></div></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="client.js"></script>
<script>
  // Abre/fecha a gaveta de música (só visual — não mexe na lógica do client.js)
  const musicPanel = document.getElementById('musicPanel');
  document.getElementById('musicToggleBtn').addEventListener('click', () => {
    musicPanel.classList.toggle('open');
  });
  document.querySelector('#musicPanel .handle').addEventListener('click', () => {
    musicPanel.classList.remove('open');
  });
</script>
</body>
</html>
